white-space:nowrap}.ta{width:100%;box-sizing:border-box;min-height:72px;padding:8px 10px;font:inherit;font-size:14px;border:1px solid var(--border-default,#D9D2C7);border-radius:8px;background:var(--bg-surface);resize:vertical}.ln{display:flex;gap:6px;align-items:center}.ln input{flex:1;min-width:0;min-height:44px;padding:0 10px;font:inherit;font-size:14px;border:1px solid var(--border-default,#D9D2C7);border-radius:8px;background:var(--bg-surface)}.sel{width:100%;box-sizing:border-box;min-height:44px;padding:0 10px;font:inherit;font-size:14px;border:1px solid var(--border-default,#D9D2C7);border-radius:8px;background:var(--bg-surface);color:inherit}.fld{display:flex;flex-direction:column;gap:6px}.fld>label{font-size:13px;font-weight:600}.errt{color:var(--danger-600,#C62828);font-size:12px}.sg{display:flex;gap:6px}.sg button{flex:1;min-height:44px;border:1px solid var(--border-default,#D9D2C7);border-radius:8px;background:var(--bg-surface);font:inherit;font-size:14px;cursor:pointer;color:inherit}.sg button[aria-pressed=true]{background:var(--brand-500);border-color:var(--brand-500);color:#fff;font-weight:600}.wrapt td{white-space:normal;line-height:1.4}.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:10px 14px;border:0;background:transparent;border-top:1px solid var(--divider)}</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
  componentDidMount() {
    const root = document.querySelector('.kg'); if (!root) return;
    const toast = m => { let t = root.querySelector('.ix-toast'); if (!t) { t = document.createElement('div'); t.className = 'ix-toast'; root.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); };
    root.addEventListener('click', ev => {
      const tab = ev.target.closest('.tabbar button');
      if (tab) { tab.parentElement.querySelectorAll('button').forEach(b => b.removeAttribute('aria-current')); tab.setAttribute('aria-current', 'page'); toast('Chuyển sang: ' + tab.textContent.trim()); return; }
      const op = ev.target.closest('[data-open]'); if (op) { const d = root.querySelector('[data-dlg="' + op.getAttribute('data-open') + '"]'); if (d) d.style.display = 'flex'; return; }
      const cl = ev.target.closest('[data-close]'); if (cl) { const d = cl.closest('[data-dlg]'); if (d) d.style.display = 'none'; return; }
      const tb = ev.target.closest('[data-toast]'); if (tb) { toast(tb.getAttribute('data-toast')); return; }
      const b = ev.target.closest('[data-save]');
      if (b && !b.disabled) { const old = b.textContent; b.disabled = true; b.setAttribute('aria-disabled', 'true'); b.textContent = 'Đang lưu…';
        setTimeout(() => { b.disabled = false; b.setAttribute('aria-disabled', 'false'); b.textContent = old; toast(b.getAttribute('data-ok')); }, 900); }
    });
    // Ô nhập có giá trị ban đầu: đặt bằng script, không dùng thuộc tính value (khung dựng bằng React sẽ khoá ô có value, gõ không đổi được)
    root.querySelectorAll('input[data-val]').forEach(i => { i.value = i.getAttribute('data-val'); });
    root.addEventListener('click', ev => { const r = ev.target.closest('[data-rail]'); if (r) { root.querySelector('.rail').classList.toggle('wide'); return; }
      const nv = ev.target.closest('[data-nav]'); if (nv) { if (nv.closest('.rail')) { root.querySelectorAll('.rail button').forEach(x => x.removeAttribute('aria-current')); nv.setAttribute('aria-current', 'page'); } toast(nv.getAttribute('data-nav')); return; }
      const dv = ev.target.closest('[data-day]'); if (dv) { root.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', 'false')); dv.setAttribute('aria-pressed', 'true'); root.querySelectorAll('[data-panel]').forEach(p => { p.style.display = p.getAttribute('data-panel') === dv.getAttribute('data-day') ? '' : 'none'; }); return; }
      const vb = ev.target.closest('[data-vw]'); if (vb) { root.querySelectorAll('[data-vw]').forEach(b => b.setAttribute('aria-pressed', 'false')); vb.setAttribute('aria-pressed', 'true'); root.querySelectorAll('[data-vpanel]').forEach(p => { p.style.display = p.getAttribute('data-vpanel') === vb.getAttribute('data-vw') ? '' : 'none'; }); } });

    let dirty = false; const setDirty = v => { dirty = v; const d = root.querySelector('[data-dirty]'); if (d) d.style.display = v ? '' : 'none'; };
    const GROUPS = {
      dn: { 'Chuyển lớp': ['Đổi giờ học', 'Đổi trình độ', 'Đổi giáo viên', 'Khác môn'], 'Đổi lịch học': ['Dời một buổi', 'Đổi ca cố định', 'Xin học bù'], 'Bảo lưu': ['Bảo lưu mới', 'Gia hạn bảo lưu', 'Quay lại học sớm'], 'Dừng học': ['Dừng học'] },
      kn: { 'Chương trình học': ['Nội dung khó hoặc dễ', 'Tiến độ', 'Không bám chương trình trên trường', 'Tài liệu'], 'Phương pháp giảng dạy': ['Cách giảng khó hiểu', 'BTVN nhiều hoặc ít', 'Kiểm tra đánh giá', 'Quản lý lớp'], 'Vận hành': ['Đổi lịch đột xuất', 'Phòng học, cơ sở vật chất', 'Sĩ số', 'Thông báo chậm'], 'Khác': ['Khác'] } };
    const fill = (sel, arr) => { sel.innerHTML = arr.map(x => '<option>' + x + '</option>').join(''); };
    const setType = k => { const g = root.querySelector('[data-grp]'); const s = root.querySelector('[data-sub]'); if (!g) return; fill(g, Object.keys(GROUPS[k])); fill(s, GROUPS[k][g.value]); };
    root.addEventListener('change', ev => { if (ev.target.matches('[data-grp]')) { const k = root.querySelector('[data-type] [aria-pressed=true]').getAttribute('data-v'); fill(root.querySelector('[data-sub]'), GROUPS[k][ev.target.value]); } if (ev.target.matches('select,input,textarea')) setDirty(true); });
    root.addEventListener('input', ev => { if (ev.target.matches('input,textarea')) setDirty(true); const sc = ev.target.closest('[data-score10]'); if (sc) { sc.value = sc.value.replace(/[^0-9.,]/g, '').slice(0, 4); const v = parseFloat(sc.value.replace(',', '.')); const er = root.querySelector('[data-scerr]'); if (er) er.style.display = (sc.value && (isNaN(v) || v < 0 || v > 10)) ? '' : 'none'; } });
    root.addEventListener('click', ev => { const nd = ev.target.closest('[data-needdesc]'); if (!nd) return; const t = root.querySelector('[data-desc]'); const er = root.querySelector('[data-descerr]'); if (!t.value.trim()) { ev.stopPropagation(); ev.preventDefault(); er.style.display = ''; t.classList.add('hmt-input-err'); t.focus(); } else { er.style.display = 'none'; t.classList.remove('hmt-input-err'); } }, true);
    root.addEventListener('click', ev => { const sb = ev.target.closest('[data-submit]'); if (!sb) return; ev.stopPropagation();
      let ok = true; const sc = root.querySelector('[data-score10]'); const v = parseFloat((sc.value || '').replace(',', '.')); const e1 = root.querySelector('[data-scerr]');
      if (isNaN(v) || v < 0 || v > 10) { e1.style.display = ''; sc.classList.add('hmt-input-err'); ok = false; } else { e1.style.display = 'none'; sc.classList.remove('hmt-input-err'); }
      [['td', '[data-err-td]'], ['pl', '[data-err-pl]']].forEach(a => { const has = root.querySelector('[data-grp15="' + a[0] + '"] [aria-pressed=true]'); root.querySelector(a[1]).style.display = has ? 'none' : ''; if (!has) ok = false; });
      if (!ok) { const f = Array.from(root.querySelectorAll('.errt')).find(x => x.style.display !== 'none'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center' }); toast('Chưa đủ: bổ sung các trường báo đỏ.'); return; }
      setDirty(false); root.querySelectorAll('input,textarea,select').forEach(x => { x.disabled = true; }); root.querySelectorAll('[data-pick] button').forEach(b => { b.disabled = true; });
      root.querySelectorAll('[data-foot]').forEach(f => { f.style.display = 'none'; }); const st = root.querySelector('[data-status]'); if (st) { st.className = 'hmt-tag hmt-tag-success'; st.textContent = 'Hoàn thành'; } const bn = root.querySelector('[data-banner]'); if (bn) bn.style.display = '';
      toast('Đã nộp kết quả cho sale.'); }, true);
    root.addEventListener('click', ev => {
      const p = ev.target.closest('[data-pick] button'); if (p) { p.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false')); p.setAttribute('aria-pressed', 'true'); setDirty(true); if (p.parentElement.hasAttribute('data-type')) setType(p.getAttribute('data-v')); return; }
      if (ev.target.closest('[data-back]')) { if (dirty) root.querySelector('[data-dlg="roi"]').style.display = 'flex'; else toast('Quay lại màn trước.'); return; }
      if (ev.target.closest('[data-leave-ok]')) { root.querySelector('[data-dlg="roi"]').style.display = 'none'; setDirty(false); toast('Đã rời màn, bỏ thay đổi chưa lưu.'); return; }
      if (ev.target.closest('[data-save]')) setTimeout(() => setDirty(false), 950);
    });
    root.addEventListener('click', ev => { const nv = ev.target.closest('[data-nav]'); if (!nv) return; if (dirty) { ev.stopPropagation(); root.querySelector('[data-dlg="roi"]').style.display = 'flex'; } }, true);

  }

}
</script>
