ing:12px 14px 6px">Học sinh</b><button class="cardrow" type="button" style="padding:10px 14px;border:0;background:transparent;border-top:1px solid var(--divider)" data-toast="Mở học sinh (màn GV-13)."><span style="flex:1">Trần Gia Hân</span><svg class="hmt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="cardrow" type="button" style="padding:10px 14px;border:0;background:transparent;border-top:1px solid var(--divider)" data-toast="Mở học sinh (màn GV-13)."><span style="flex:1">Đỗ Phương Thảo</span><svg class="hmt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="cardrow" type="button" style="padding:10px 14px;border:0;background:transparent;border-top:1px solid var(--divider)" data-toast="Mở học sinh (màn GV-13)."><span style="flex:1">Bùi Tuệ Minh</span><svg class="hmt-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button></div></div><div style="padding:10px 12px;background:var(--bg-surface);border-top:1px solid var(--divider);display:flex;gap:8px"><button class="hmt-btn" type="button" data-toast="Yêu cầu bổ trợ (màn BUOI-09)." style="flex:1;min-height:48px">Yêu cầu bổ trợ</button><button class="hmt-btn hmt-btn-primary" type="button" data-toast="Tạo ticket (màn GV-14)." style="flex:1;min-height:48px">Tạo ticket</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
  componentDidMount() {
    const root = document.querySelector('.kg'); if (!root) return;
    const toast = m => { let t = root.querySelector('.ix-toast'); if (!t) { t = document.createElement('div'); t.className = 'ix-toast'; root.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); };
    root.addEventListener('click', ev => {
      const tab = ev.target.closest('.tabbar button');
      if (tab) { tab.parentElement.querySelectorAll('button').forEach(b => b.removeAttribute('aria-current')); tab.setAttribute('aria-current', 'page'); toast('Chuyển sang: ' + tab.textContent.trim()); return; }
      const op = ev.target.closest('[data-open]'); if (op) { const d = root.querySelector('[data-dlg="' + op.getAttribute('data-open') + '"]'); if (d) d.style.display = 'flex'; return; }
      const cl = ev.target.closest('[data-close]'); if (cl) { const d = cl.closest('[data-dlg]'); if (d) d.style.display = 'none'; return; }
      const tb = ev.target.closest('[data-toast]'); if (tb) { toast(tb.getAttribute('data-toast')); return; }
      const b = ev.target.closest('[data-save]');
      if (b && !b.disabled) { const old = b.textContent; b.disabled = true; b.setAttribute('aria-disabled', 'true'); b.textContent = 'Đang lưu…';
        setTimeout(() => { b.disabled = false; b.setAttribute('aria-disabled', 'false'); b.textContent = old; toast(b.getAttribute('data-ok')); }, 900); }
    });
  }

}
</script>
