<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
  componentDidMount() {
    const root = document.querySelector('.kg'); if (!root) return;
    const toast = m => { let t = root.querySelector('.ix-toast'); if (!t) { t = document.createElement('div'); t.className = 'ix-toast'; root.appendChild(t); } t.textContent = m; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600); };
    root.addEventListener('click', ev => {
      const tab = ev.target.closest('.tabbar button');
      if (tab) { tab.parentElement.querySelectorAll('button').forEach(b => b.removeAttribute('aria-current')); tab.setAttribute('aria-current', 'page'); toast('Chuyển sang: ' + tab.textContent.trim()); return; }
      const op = ev.target.closest('[data-open]'); if (op) { const d = root.querySelector('[data-dlg="' + op.getAttribute('data-open') + '"]'); if (d) d.style.display = 'flex'; return; }
      const cl = ev.target.closest('[data-close]'); if (cl) { const d = cl.closest('[data-dlg]'); if (d) d.style.display = 'none'; return; }
      const tb = ev.target.closest('[data-toast]'); if (tb) { toast(tb.getAttribute('data-toast')); return; }
      const b = ev.target.closest('[data-save]');
      if (b && !b.disabled) { const old = b.textContent; b.disabled = true; b.setAttribute('aria-disabled', 'true'); b.textContent = 'Đang lưu…';
        setTimeout(() => { b.disabled = false; b.setAttribute('aria-disabled', 'false'); b.textContent = old; toast(b.getAttribute('data-ok')); }, 900); }
    });
    root.addEventListener('click', ev => { const r = ev.target.closest('[data-rail]'); if (r) { root.querySelector('.rail').classList.toggle('wide'); return; }
      const nv = ev.target.closest('[data-nav]'); if (nv) { if (nv.closest('.rail')) { root.querySelectorAll('.rail button').forEach(x => x.removeAttribute('aria-current')); nv.setAttribute('aria-current', 'page'); } toast(nv.getAttribute('data-nav')); return; }
      const dv = ev.target.closest('[data-day]'); if (dv) { root.querySelectorAll('[data-day]').forEach(b => b.setAttribute('aria-pressed', 'false')); dv.setAttribute('aria-pressed', 'true'); root.querySelectorAll('[data-panel]').forEach(p => { p.style.display = p.getAttribute('data-panel') === dv.getAttribute('data-day') ? '' : 'none'; }); return; }
      const vb = ev.target.closest('[data-vw]'); if (vb) { root.querySelectorAll('[data-vw]').forEach(b => b.setAttribute('aria-pressed', 'false')); vb.setAttribute('aria-pressed', 'true'); root.querySelectorAll('[data-vpanel]').forEach(p => { p.style.display = p.getAttribute('data-vpanel') === vb.getAttribute('data-vw') ? '' : 'none'; }); } });

    const DATA = {"10": {"lab": "Tháng 10/2026", "st": ["Đang diễn ra, chưa chốt", ""], "buoi": 14, "gio": "21,0", "tre": 2, "giotre": "3,0", "loai": [["Học chính", 9, "13,5"], ["Củng cố", 2, "3,0"], ["Học bù", 1, "1,5"], ["Học bổ trợ", 2, "3,0"]]}, "09": {"lab": "Tháng 9/2026", "st": ["Đã chốt", "ok"], "buoi": 22, "gio": "33,0", "tre": 1, "giotre": "1,0", "loai": [["Học chính", 16, "24,0"], ["Củng cố", 3, "4,5"], ["Học bù", 1, "1,5"], ["Học bổ trợ", 2, "3,0"]]}};
    let cur = '10';
    const render = () => { const d = DATA[cur];
      root.querySelectorAll('[data-month-label]').forEach(e => { e.textContent = d.lab; });
      const st = root.querySelector('[data-mstat]'); st.textContent = d.st[0]; st.className = 'hmt-tag ' + (d.st[1] ? 'hmt-tag-success' : '');
      root.querySelector('[data-v=buoi]').textContent = d.buoi; root.querySelector('[data-v=gio]').textContent = d.gio; root.querySelector('[data-v=tre]').textContent = d.tre; root.querySelector('[data-v=giotre]').textContent = d.giotre;
      const tot = parseFloat(d.gio.replace(',', '.'));
      root.querySelectorAll('[data-loai]').forEach((e, i) => { const l = d.loai[i]; e.querySelector('[data-ln]').textContent = l[1] + ' buổi · ' + l[2] + ' giờ'; e.querySelector('i').style.width = Math.round(100 * parseFloat(l[2].replace(',', '.')) / tot) + '%'; });
      root.querySelector('[data-next]').disabled = cur === '10'; root.querySelector('[data-prev]').disabled = cur === '09'; };
    root.addEventListener('click', ev => { if (ev.target.closest('[data-prev]')) { cur = '09'; render(); } else if (ev.target.closest('[data-next]')) { cur = '10'; render(); } });
    render();

  }

}
</script>
