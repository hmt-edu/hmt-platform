function Demo() {
    const { Field, TextInput, Select, Textarea, Button, Alert } = HMT;

    const LABEL = { name: "Họ tên học sinh", phone: "SĐT phụ huynh", campus: "Cơ sở", note: "Ghi chú" };

            React.createElement("ul", { style: { margin: "6px 0 0", paddingLeft: 20 } }, keys.map((k) => React.createElement("li", { key: k },
                React.createElement("a", { href: `#f-${k}`, onClick: (e) => { e.preventDefault(); const el = document.querySelector(`[data-k="${k}"]`); el && el.focus(); } },
                    LABEL[k],
                    ": ",
                    errs[k])))))) : null,
        done ? React.createElement(HMT.Alert, { tone: "success", title: "\u0110\u00E3 l\u01B0u h\u1ECDc sinh", live: true }, "Th\u00F4ng tin \u0111\u00E3 \u0111\u01B0\u1EE3c th\u00EAm v\u00E0o danh s\u00E1ch l\u1EDBp ch\u1EDD x\u1EBFp.") : null,

        React.createElement(Field, { label: "S\u0110T ph\u1EE5 huynh", required: true, helper: "D\u00F9ng \u0111\u1EC3 g\u1EEDi th\u00F4ng b\u00E1o h\u1ECDc ph\u00ED, l\u1ECBch h\u1ECDc", error: show("phone") },

        React.createElement(Field, { label: "Ghi ch\u00FA", optional: true, error: show("note") },
            React.createElement(Textarea, { "data-k": "note", value: v.note, onChange: upd("note"), onBlur: blur("note"), maxLength: 200, placeholder: "H\u1ECDc l\u1EF1c, nguy\u1EC7n v\u1ECDng c\u1EE7a ph\u1EE5 huynh\u2026" })),
        React.createElement(Field, { label: "M\u00E3 h\u1ECDc sinh", helper: "T\u1EF1 sinh khi l\u01B0u" },
            React.createElement(TextInput, { value: "HS000142", disabled: true })),
        React.createElement("div", { className: "hmt-demo-row" },
            React.createElement(Button, { type: "submit" }, "L\u01B0u h\u1ECDc sinh"),
            React.createElement(Button, { variant: "tertiary", onClick: () => { setV({ name: "", phone: "", campus: "", note: "" }); setTouched({}); setSubmitted(false); setDone(false); } }, "L\u00E0m l\u1EA1i")),
        React.createElement("p", { className: "hmt-help" }, "L\u1ED7i hi\u1EC7n khi r\u1EDDi \u00F4 (blur) ho\u1EB7c khi b\u1EA5m L\u01B0u; khi g\u1EEDi, t\u00F3m t\u1EAFt l\u1ED7i nh\u1EADn focus v\u00E0 m\u1ED7i d\u00F2ng d\u1EABn t\u1EDBi \u00F4 l\u1ED7i.")));
}

</script>
