<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
  componentDidMount() {
    const R = document.querySelector('[data-ix=root]');
    this._h = (e) => {
      if (!R.contains(e.target)) return;
      const t = e.target.closest('[data-tg]');
      if (t) { const b = R.querySelector('[data-bd="' + t.getAttribute('data-tg') + '"]'); if (b) { b.hidden = !b.hidden; t.setAttribute('aria-expanded', b.hidden ? 'false' : 'true'); } return; }
      const o = e.target.closest('[data-open]');
      if (o) { const d = R.querySelector('[data-dlg="' + o.getAttribute('data-open') + '"]'); if (d) d.style.display = 'flex'; return; }
      const c = e.target.closest('[data-close]');
      if (c) { const d = c.closest('[data-dlg]'); if (d) d.style.display = 'none'; return; }
      const sg = e.target.closest('[data-seg] button');
      if (sg) { sg.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === sg ? 'true' : 'false')); }
    };
    document.addEventListener('click', this._h);
  }
  componentWillUnmount() { document.removeEventListener('click', this._h); }
}
</script>
