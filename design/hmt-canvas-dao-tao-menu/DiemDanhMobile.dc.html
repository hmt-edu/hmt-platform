.sumCls }}">{{ dy.summary }}</span></button></sc-if><sc-if value="{{ dy.open }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:8px;flex-shrink:0"><sc-for list="{{ dy.groups }}" as="g" hint-placeholder-count="3"><section class="hmt-box" style="overflow:hidden;flex-shrink:0"><button type="button" onClick="{{ g.toggle }}" aria-expanded="{{ g.open }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;background:var(--bg-page)"><span style="display:flex;transform:{{ g.rot }}"><svg class="hmt-ic" viewBox="0 0 24 24" aria-hidden="true" ><path d="m6 9 6 6 6-6"/></svg></span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><b style="font-family:var(--font-heading);font-size:15px">{{ g.cls }}</b><span class="hmt-help">{{ g.meta }}</span></span><span class="hmt-tag {{ g.progCls }}">{{ g.prog }}</span></button><sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}"><div><sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3"><div style="padding:10px 14px 12px;border-top:1px solid var(--divider)"><div style="display:flex;align-items:center;margin-bottom:8px"><b style="font-size:14px;flex:1">{{ r.name }}</b><sc-if value="{{ r.isSaved }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--success-text)"><svg class="hmt-ic" viewBox="0 0 24 24" aria-hidden="true" ><path d="M20 6 9 17l-5-5"/></svg> Đã lưu</span></sc-if><sc-if value="{{ r.notSaved }}" hint-placeholder-val="{{ false }}"><span class="hmt-help">Chưa điểm danh</span></sc-if></div><div style="display:flex;justify-content:space-between;padding:0 4px"><sc-for list="{{ r.btns }}" as="b" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;align-items:center;gap:3px"><button type="button" style="{{ b.style }}" aria-pressed="{{ b.on }}" aria-label="{{ b.cap }}" disabled="{{ b.disabled }}" onClick=" <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {}; const self = this;
    const DAYS = [{"d": "2026-11-27", "label": "Thứ Sáu 27/11", "groups": [{"id": "a0", "cls": "Toán 5C1", "meta": "15:30–17:00 · Phòng 201 · Cô Lê Thu Hà", "locked": true, "rows": [["a0-1", "Nguyễn Hải Đăng", "P", "P", "", ""], ["a0-2", "Trần Ngọc Diệp", "P", "P", "", ""], ["a0-3", "Lê Minh Quân", "L", "L", "Kẹt xe", "Đến lúc 15:50"], ["a0-4", "Phạm Bảo Châu", "E", "E", "Ốm", "Mẹ báo từ hôm qua"]]}, {"id": "a1", "cls": "Toán 6A1", "meta": "17:30–19:00 · Phòng 203 · Cô Nguyễn Thị Lan", "locked": false, "rows": [["a1-1", "Nguyễn Minh Khôi", "P", "P", "", ""], ["a1-2", "Trần Gia Hân", "L", "L", "Kẹt xe", "Báo sẽ đến lúc 17:50"], ["a1-3", "Lê Bảo An", null, null, "", ""], ["a1-4", "Phạm Quốc Huy", "P", "X", "", ""], ["a1-5", "Đỗ Thanh Mai", "E", "E", "Ốm", "Mẹ gọi báo sáng nay"], ["a1-6", "Vũ Đức Anh", null, "P", "", ""]]}, {"id": "a2", "cls": "Toán 7B2", "meta": "19:00–20:30 · Phòng 105 · Thầy Phạm Văn Hải", "locked": false, "rows": [["a2-1", "Hoàng Khánh Linh", "P", "P", "", ""], ["a2-2", "Bùi Tuấn Kiệt", "X", "X", "Chưa liên hệ được", "Gọi lần 1 chưa bắt máy"], ["a2-3", "Ngô Phương Thảo", null, null, "", ""], ["a2-4", "Đặng Gia Bảo", "L", "P", "Việc gia đình", "Đến muộn 15 phút"]]}]}, {"d": "2026-11-26", "label": "Thứ Năm 26/11", "groups": [{"id": "b0", "cls": "Toán 4B3", "meta": "08:30–10:00 · Phòng 101 · Thầy Lê Quang Vinh", "locked": true, "rows": [["b0-1", "Đinh Gia Phúc", "P", "P", "", ""], ["b0-2", "Lương Mỹ Linh", "P", "P", "", ""], ["b0-3", "Võ Anh Tuấn", "P", "P", "", ""]]}, {"id": "b1", "cls": "Toán 6B1", "meta": "17:30–19:00 · Phòng 103 · Cô Nguyễn Thị Lan", "locked": false, "rows": [["b1-1", "Trần Bảo Ngọc", "P", "P", "", ""], ["b1-2", "Lê Hải Yến", null, null, "", ""], ["b1-3", "Phạm Đức Minh", "L", "L", "Kẹt xe", "Đến lúc 17:45"]]}, {"id": "b2", "cls": "Toán 8A1", "meta": "19:00–20:30 · Phòng 102 · Cô Đỗ Mai Phương", "locked": false, "rows": [["b2-1", "Ngô Thanh Tùng", null, null, "", ""], ["b2-2", "Bùi Khánh An", null, null, "", ""]]}]}, {"d": "2026-11-25", "label": "Thứ Tư 25/11", "groups": [{"id": "c0", "cls": "Toán 5C1", "meta": "15:30–17:00 · Phòng 201 · Cô Lê Thu Hà", "locked": true, "rows": [["c0-1", "Nguyễn Hải Đăng", "P", "P", "", ""], ["c0-2", "Trần Ngọc Diệp", "L", "L", "Việc gia đình", "Đến lúc 15:45"]]}, {"id": "c1", "cls": "Toán 7A2", "meta": "19:00–20:30 · Phòng 203 · Thầy Lê Quang Vinh", "locked": false, "rows": [["c1-1", "Hoàng Gia Hưng", "P", "X", "", ""], ["c1-2", "Vũ Bảo Anh", null, "P", "", ""]]}]}, {"d": "2026-11-23", "label": "Thứ Hai 23/11", "groups": [{"id": "d0", "cls": "Toán 4B3", "meta": "08:30–10:00 · Phòng 101 · Thầy Lê Quang Vinh", "locked": true, "rows": [["d0-1", "Đinh Gia Phúc", "P", "P", "", ""], ["d0-2", "Lương Mỹ Linh", "E", "E", "Ốm", "Giấy báo ốm"]]}]}]; const INIT = {"preset": "today"};
    const TODAY = '2026-11-27';
    const add = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const preset = S.preset || INIT.preset;
    const range = { today: [TODAY, TODAY], yesterday: [add(TODAY, -1), add(TODAY, -1)], d7: [add(TODAY, -6), TODAY] }[preset];
    const LAB = [['P','CM','Có mặt','success'],['L','M','Muộn','warning'],['E','VP','Có phép','info'],['X','VK','Không phép','danger']];
    const CLR = { success: ['var(--success-bg)','var(--success-solid)','var(--success-text)'], warning: ['var(--warning-bg)','var(--warning-solid)','var(--warning-text)'], info: ['var(--info-bg)','var(--info-solid)','var(--info-text)'], danger: ['var(--danger-bg)','var(--danger-solid)','var(--danger-text)'] };
    const st = S.st || {}; const openM = S.open || {}; const dayOpen = S.dayOpen || {};
    const cnt = { P: 0, L: 0, A: 0, N: 0 }; let sessions = 0, incomplete = 0;
    const multi = range[0] !== range[1];
    const days = DAYS.filter((d) => d.d >= range[0] && d.d <= range[1]).map((d) => {
      let dInc = 0;
      const groups = d.groups.map((g) => {
        let n = 0;
        const rows = g.rows.map((r) => {
          const cur = (r[0] in st) ? st[r[0]] : r[2];
          if (cur === 'P') cnt.P++; else if (cur === 'L') cnt.L++; else if (cur === 'E' || cur === 'X') cnt.A++; else cnt.N++;
          if (cur) n++;
          const btns = LAB.map((l) => {
            const on = cur === l[0]; const c = CLR[l[3]];
            const style = 'width:46px;height:46px;border-radius:50%;font:inherit;font-size:13px;font-weight:700;cursor:' + (g.locked ? 'not-allowed' : 'pointer') + ';' + (on ? 'border:3px solid ' + c[1] + ';background:' + c[0] + ';color:' + c[2] + ';' : 'border:1px solid var(--input-border);background:var(--bg-surface);color:var(--text-label);');
            return { code: l[1], cap: l[2], style, on, disabled: g.locked, pick: () => { const t = self.state || {}; self.setState({ st: Object.assign({}, t.st || {}, { [r[0]]: l[0] }) }); } };
          });
          return { name: r[1], btns, isSaved: !!cur, notSaved: !cur };
        });
        sessions++; if (n < rows.length) { incomplete++; dInc++; }
        const isOpen = (g.id in openM) ? openM[g.id] : (!g.locked && g.id === (multi ? 'b1' : 'a1'));
        return { cls: g.cls, meta: g.meta.split(' · ').slice(0, 2).join(' · ') + (g.locked ? ' · Đã Done' : ''), rows, locked: g.locked, open: isOpen, rot: isOpen ? 'rotate(0deg)' : 'rotate(-90deg)', prog: n + '/' + rows.length, progCls: n === rows.length ? 'hmt-tag-success' : 'hmt-tag-warning',
          toggle: () => { const t = self.state || {}; self.setState({ open: Object.assign({}, t.open || {}, { [g.id]: !isOpen }) }); } };
      });
      const dOpen = (d.d in dayOpen) ? dayOpen[d.d] : true;
      return { label: d.label, showHeader: multi, open: dOpen || !multi, rot: dOpen ? 'rotate(0deg)' : 'rotate(-90deg)', groups, summary: groups.length + ' buổi' + (dInc ? ' · ' + dInc + ' chưa đủ' : ''), sumCls: dInc ? 'hmt-tag-warning' : 'hmt-tag-success',
        toggle: () => { const t = self.state || {}; self.setState({ dayOpen: Object.assign({}, t.dayOpen || {}, { [d.d]: !dOpen }) }); } };
    });
    const setP = (p) => () => self.setState({ preset: p });
    return { days, cP: cnt.P, cL: cnt.L, cA: cnt.A, cN: cnt.N, incomplete: incomplete + ' buổi chưa đủ', pToday: preset === 'today', pYes: preset === 'yesterday', p7: preset === 'd7', setToday: setP('today'), setYes: setP('yesterday'), set7: setP('d7') };
  }
}
</script>
