</style><div style="padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg-page);height:100%"><div style="display:flex;align-items:center;gap:8px"><b style="font-family:var(--font-heading);font-size:17px">Người dùng</b></div><div class="hmt-box hmt-box-pad" style="display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left"><b>Nguyễn Thị Lan · NV000012</b><span class="hmt-help">Tuyển sinh · CS1 · đang hoạt động</span></div></div><div style="position:absolute;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-end"><div data-pw data-copied="0" style="width:100%;background:var(--bg-surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow-md);display:flex;flex-direction:column;max-height:92%"><div style="display:flex;justify-content:center;padding:8px 0 2px"><i style="width:40px;height:4px;border-radius:2px;background:var(--input-border)"></i></div><div style="display:flex;align-items:center;padding:4px 16px 8px;gap:8px"><b style="flex:1;font-family:var(--font-heading);font-size:17px;line-height:24px">Mật khẩu tạm</b><button class="hmt-iconbtn" type="button" aria-label="Đóng" data-x disabled><svg class="hmt-ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button></div><div style="padding:4px 16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:12px"><div style="font-size:14px">Đã tạo tài khoản cho <b>Nguyễn Thị Lan</b> · NV000012 · Tuyển sinh · CS1.</div><div style="display:flex;align-items:center;gap:var(--space-3);border:var(--border-1) solid var(--divider);border-radius:var(--radius-md);background:var(--bg-subtle);padding:var(--space-3) var(--space-4)"><code data-pwtxt style="flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.06em;font-weight:600;user-select:all;overflow-wrap:anywhere">Hm7q-Rt4v-Kx2n</code><button class="hmt-btn" type="button" data-copy style="height:44px;flex:0 0 auto"><svg class="hmt-ic " viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg><span data-copylab>Sao chép</span></button></div><div class="hmt-alert hmt-alert-warning" role="alert"><svg class="hmt-ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /> <path d="M12 9v4" /> <path d="M12 17h.01" /></svg><span><b>Mật khẩu chỉ hiện một lần.</b> Đóng hộp là không xem lại được.</span></div><span class="hmt-help">Người dùng phải đổi mật khẩu này ở lần đăng nhập đầu tiên (CHUNG-07).</span><label class="hmt-check"><input type="checkbox" data-ack> Tôi đã ghi lại mật khẩu này</label></div><div style="display:flex;gap:8px;padding:12px 16px 20px;border-top:1px solid var(--divider)"><button class="hmt-btn hmt-btn-primary" type="button" data-close disabled style="flex:1;height:44px">Đóng</button></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
  componentDidMount() {
    const R = document.querySelector('[data-ix=root]'); if (!R) return;
    let t = null;
    const toast = m => { let e = R.querySelector('.ix-toast'); if (!e) { e = document.createElement('div'); e.className = 'ix-toast'; R.appendChild(e); } e.textContent = m; e.classList.add('on'); clearTimeout(t); t = setTimeout(() => e.classList.remove('on'), 2600); };
    // Đóng chỉ mở khi đã bấm Sao chép hoặc đã tick "Tôi đã ghi lại mật khẩu này"
    const sync = d => { const ck = d.querySelector('[data-ack]'), go = d.querySelector('[data-close]'); const ok = d.getAttribute('data-copied') === '1' || (ck && ck.checked); if (go) { go.disabled = !ok; go.setAttribute('aria-disabled', ok ? 'false' : 'true'); } const x = d.querySelector('[data-x]'); if (x) { x.disabled = !ok; } };
    R.querySelectorAll('[data-pw]').forEach(sync);
    R.addEventListener('change', ev => { const d = ev.target.closest('[data-pw]'); if (d) sync(d); });
    R.addEventListener('click', ev => {
      const d = ev.target.closest('[data-pw]'); if (!d) return;
      const c = ev.target.closest('[data-copy]');
      if (c) { const txt = (d.querySelector('[data-pwtxt]') || {}).textContent || ''; try { if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {} d.setAttribute('data-copied', '1'); const l = d.querySelector('[data-copylab]'); if (l) l.textContent = 'Đã sao chép'; sync(d); toast('Đã sao chép mật khẩu tạm.'); return; }
      const g = ev.target.closest('[data-close],[data-x]'); if (g && !g.disabled) { toast('Đã đóng hộp. Mật khẩu không xem lại được.'); }
    });
  }
}
</script>
