# Cấu hình cho hệ thống điều phối «Văn phòng AI» (kho hmt-edu/dieu-phoi-kit). Chỉ chứa cấu hình, không có bí mật.
# Luật riêng của HMT (đánh số migration, «OK ĐƯA VÀO LUẬT», canvas, v.v.) nằm trong CLAUDE.md và docs/ (liệt kê ở duong_dan_tai_lieu), KHÔNG nằm trong lõi của hệ thống điều phối.
ten: HMT Platform
kho_github: hmt-edu/hmt-platform
nhanh_chinh: main
thu_muc_goc: ~/Developer/hmt-platform
cach_tao_thu_muc_vai: 'git worktree add {thu_muc} -b {nhanh} origin/{nhanh_chinh}'
# Tên job CI phải xanh (đối chiếu check-runs thật của kho, 11/11/2026); «Chưa bật staging», «Báo main đỏ», «Bản xem trước», cổng «Main có commit mới…» có thể bị bỏ qua nên KHÔNG đưa vào.
buoc_ci_bat_buoc: ['checks / lint, typecheck, test, hardcode', 'DB (pgTAP) + Playwright']
luat_gop: { ai_ok: ['OK-CHAT-ĐÊM <mã>'], kieu: squash, chi_tac_gia: ['hmt-vanhanh'] } # OK chỉ ở đầu dòng, khớp commit cuối, CI xanh; deploy production/dữ liệu thật vẫn chỉ anh Trường
lenh_kiem_cuc_bo: 'npm run check:all'
duong_dan_tai_lieu:
  [
    'CLAUDE.md',
    'docs/quy-tac-cung-cho-code.md',
    'docs/quy-trinh-theo-ca.md',
    'docs/TIEN-DO.md',
    'docs/ke-hoach',
  ]
lenh_cam:
  [
    'deploy production',
    'chạy migration hoặc sửa tay cơ sở dữ liệu chạy thật',
    'nạp dữ liệu thật',
    'force push',
    'sửa docs/spec/04-luat-nghiep-vu.md khi chưa có «OK ĐƯA VÀO LUẬT» của anh Trường',
    'commit thư mục _inbox/',
  ]
ngan_sach_ci: { phut_toi_da: 3000 } # gói miễn phí 12 đô; PR chỉ tài liệu/công cụ không cần CI; đẩy MỘT lần sau khi check:all xanh
