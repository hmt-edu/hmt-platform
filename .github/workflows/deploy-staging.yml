# Gộp vào main: áp migration lên hmt-staging, triển khai bản thử nghiệm, gắn tag. KHÔNG chạy lại kiểm tra nhanh (lint, typecheck, test):
# PR đã qua CI xanh ở commit cuối trước khi gộp (Đ210 #1, Đ281); bài kiểm cô lập hmt-prod vẫn chạy ở đây.
# Repo variable STAGING_READY = 'true' bật workflow này (xem README).
name: Deploy staging

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - 'deploy/**' # bản chép cho hmt-deploy, không chạy ở repo này (Đ281)
      - '**/*.md'
  workflow_dispatch:

# Không huỷ lượt đang chạy: migration phải chạy trọn.
concurrency:
  group: staging
  cancel-in-progress: false

permissions: {}

jobs:
  not-ready:
    name: Chưa bật staging
    if: vars.STAGING_READY != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "::warning::Bỏ qua triển khai thử nghiệm vì repo variable STAGING_READY chưa đặt là 'true' (xem README)."

  deploy-staging:
    name: deploy-staging
    if: vars.STAGING_READY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Repo công khai: secret thử nghiệm nằm trong GitHub Environment `staging` (chỉ nhánh main được dùng), không ở secret chung của repo.
    # `vars.STAGING_READY` và các biến `vars.*` khác vẫn ở biến chung của repo (job-level `if` không đọc được biến của Environment).
    # Cách tạo Environment và chuyển secret: docs/van-hanh/cong-khai-repo.md, mục 8.
    environment: staging
    permissions:
      contents: write # chỉ để đẩy tag staging-…
    steps:
      - name: Kiểm tra secrets, variables
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          missing=""
          [ -n "$STAGING_DB_URL" ] || missing="$missing STAGING_DB_URL"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu cấu hình cho môi trường thử nghiệm:$missing. Vào Settings > Secrets and variables > Actions của hmt-platform để thêm, hoặc đặt STAGING_READY khác 'true' để tạm tắt."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Áp migration lên hmt-staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        # --include-all: áp cả migration có số THẤP hơn bản đã áp (PR gộp song song nên số không luôn tăng theo thời điểm gộp). Thiếu cờ này, db push dừng với
        # lỗi «file migration chèn trước bản đã áp» và staging kẹt. Rủi ro: một migration chèn trước chạy khi migration sau nó đã áp; PR có migration vẫn nên
        # dùng số lớn hơn mọi số trên main (Tester kiểm), cờ này chỉ là lưới an toàn. Bản chạy thật (hmt-deploy) cần cùng cờ, xem deploy/.
        run: npx supabase db push --db-url "$STAGING_DB_URL" --include-all --yes

      # Dữ liệu giả CHỈ cho thử nghiệm (seed.sql chạy lại được, không nhân đôi).
      # Bản chạy thật (hmt-deploy) không bao giờ chạy bước này.
      - name: Nạp dữ liệu giả vào hmt-staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -q -f supabase/seed.sql

      # Bật dữ liệu mẫu CHỈ ở hmt-staging: dòng khoá môi trường STAGING + công tắc demo_data_enabled (E-23-32). Chạy lại được.
      # Bản chạy thật (hmt-deploy) không có bước này nên không có dòng STAGING và hàm dữ liệu mẫu luôn từ chối.
      - name: Bật dữ liệu mẫu trên hmt-staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -q -f supabase/seed-staging-demo-flag.sql

      # Thử quyền ghi bảng Auth của hàm admin_reset_mfa (Đ49): giao dịch hoàn tác, không để lại dữ liệu. Không đạt thì chỉ cảnh báo
      # (hàm chưa được giao diện dùng) để báo anh quyết quay lại Edge Function; không chặn lượt triển khai.
      - name: Thử quyền ghi bảng Auth trên hmt-staging
        continue-on-error: true
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if out="$(psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -q -f scripts/staging-probe-auth.sql 2>&1)"; then
            echo "::notice::Thử quyền ghi bảng Auth trên hmt-staging: ĐẠT."
          else
            echo "::warning::Thử quyền ghi bảng Auth trên hmt-staging: KHÔNG ĐẠT. Báo anh Trường để quay lại Edge Function. $(printf '%s' "$out" | head -n 3 | cut -c1-200)"
            exit 1
          fi

      # Kiểm sau khi chuyển danh sách em (migration 043): chỉ đọc. Lệch thì báo lỗi để anh biết ngay; không chặn bước sau.
      - name: Kiểm danh sách em trên hmt-staging
        continue-on-error: true
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if out="$(psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -q -f scripts/staging-check-prospect.sql 2>&1)"; then
            echo "::notice::Kiểm danh sách em trên hmt-staging: ĐẠT."
          else
            echo "::warning::Kiểm danh sách em trên hmt-staging: LỆCH. Báo anh Trường. $(printf '%s' "$out" | head -n 3 | cut -c1-200)"
            exit 1
          fi

      # Edge Function (đăng nhập, quản trị tài khoản, chặn thư). Cần SUPABASE_ACCESS_TOKEN của tài khoản
      # TÀI KHOẢN CHỦ DỰ ÁN (không còn quyền gì ở hmt-prod). Chưa có thì bỏ qua kèm cảnh báo.
      - name: Triển khai Edge Function lên hmt-staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STAGING_TURNSTILE_SECRET: ${{ secrets.STAGING_TURNSTILE_SECRET }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Chưa có secret SUPABASE_ACCESS_TOKEN: chưa triển khai Edge Function."
            exit 0
          fi
          ref="$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')"
          # CORS: chỉ thử nghiệm nhận trang xem trước của từng PR (L4); tên miền chính của thử nghiệm.
          # HMT_SECRET_KEY: khoá sb_secret_ để Edge Function login chuyển IP thật của người dùng sang Supabase Auth
          # (Sb-Forwarded-For); thiếu thì mọi lần đăng nhập bị tính chung IP máy chủ. Ghi qua file tạm, không lộ trên log.
          env_file="$RUNNER_TEMP/functions.env"
          # Xoá file chứa khoá cả khi bước lỗi giữa chừng.
          trap 'rm -f "$env_file"' EXIT
          {
            echo "HMT_ALLOW_STAGING_PREVIEWS=true"
            echo "HMT_ALLOW_LOCAL_ORIGINS=true"
            echo "HMT_ALLOWED_ORIGINS=https://hmt-staging.pages.dev"
            key="$(printf '%s' "$STAGING_SUPABASE_SECRET_KEY" | tr -d '[:space:]')"
            if [ -n "$key" ]; then echo "HMT_SECRET_KEY=$key"; fi
            # Khoá bí mật Turnstile: Edge Function login tự kiểm mã chống máy (Supabase Auth bỏ qua khi gọi bằng khoá secret).
            turnstile="$(printf '%s' "$STAGING_TURNSTILE_SECRET" | tr -d '[:space:]')"
            if [ -n "$turnstile" ]; then echo "HMT_TURNSTILE_SECRET=$turnstile"; fi
          } > "$env_file"
          [ -n "$STAGING_SUPABASE_SECRET_KEY" ] || echo "::warning::Chưa có STAGING_SUPABASE_SECRET_KEY: Edge Function chưa chuyển được IP thật."
          [ -n "$STAGING_TURNSTILE_SECRET" ] || echo "::warning::Chưa có STAGING_TURNSTILE_SECRET: Edge Function login sẽ từ chối mọi lần đăng nhập."
          npx supabase secrets set --project-ref "$ref" --env-file "$env_file"
          npx supabase functions deploy --project-ref "$ref" --use-api

      # Mở schema `app` qua Data API của hmt-staging. config.toml chỉ áp ở local, `db push` không đổi cài đặt API của project hosted:
      # thiếu bước này thì mọi lệnh gọi rpc vào schema app báo PGRST106 và đăng nhập báo «Hệ thống đang lỗi». Làm đúng một lần cho mỗi lượt triển khai,
      # idempotent (chỉ thêm `app` nếu chưa có, giữ nguyên các schema khác). Cần SUPABASE_ACCESS_TOKEN; chưa có thì cảnh báo, bước kiểm cuối sẽ báo lỗi.
      - name: Mở schema app qua Data API trên hmt-staging
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Chưa có SUPABASE_ACCESS_TOKEN: không tự mở được schema app qua Data API."
            exit 0
          fi
          ref="$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')"
          api="https://api.supabase.com/v1/projects/$ref/postgrest"
          # Token đọc được nhưng có thể thiếu quyền GHI cấu hình project (403): chỉ cảnh báo, KHÔNG làm đỏ lượt triển khai; anh bật tay (docs/van-hanh/mo-schema-app-data-api.md).
          warn_manual() { echo "::warning::Token SUPABASE_ACCESS_TOKEN thiếu quyền ghi cấu hình project (hoặc API lỗi): anh Trường bật tay Exposed schemas thêm app (docs/van-hanh/mo-schema-app-data-api.md). Bước kiểm cuối sẽ báo nếu vẫn thiếu."; exit 0; }
          current="$(curl -fsS "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")" || warn_manual
          schemas="$(printf '%s' "$current" | jq -r '.db_schema')"
          if printf ',%s,' "$schemas" | grep -q ',app,'; then
            echo "Schema app đã mở qua Data API."
            exit 0
          fi
          body="$(jq -nc --arg s "$schemas,app" '{db_schema: $s}')"
          curl -fsS -X PATCH "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body" > /dev/null || warn_manual
          echo "Đã thêm schema app vào Exposed schemas của hmt-staging."

      # Đồng bộ cài đặt Auth của hmt-staging với supabase/config.toml (chỉ áp ở local, db push không đổi project hosted). Thiếu Auth Hook
      # «Customize Access Token» thì token không có vai trò (hmt_roles), đăng nhập vào được nhưng không có quyền gì. Idempotent: PATCH cùng giá trị.
      # Không đụng captcha, SMTP, URL (khác nhau giữa môi trường). Bước kiểm cuối cùng sẽ báo đỏ nếu hook vẫn tắt.
      - name: Đồng bộ cài đặt Auth trên hmt-staging
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Chưa có SUPABASE_ACCESS_TOKEN: không đồng bộ được cài đặt Auth."
            exit 0
          fi
          ref="$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')"
          # Giá trị theo config.toml: hook, tắt tự đăng ký, tắt ẩn danh, mật khẩu >= 8 chữ + số, TOTP tối đa 2 thiết bị, xoay refresh token.
          body="$(jq -nc '{
            hook_custom_access_token_enabled: true,
            hook_custom_access_token_uri: "pg-functions://postgres/app/custom_access_token_hook",
            disable_signup: true,
            external_anonymous_users_enabled: false,
            password_min_length: 8,
            password_required_characters: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789",
            mfa_totp_enroll_enabled: true,
            mfa_totp_verify_enabled: true,
            mfa_max_enrolled_factors: 2,
            refresh_token_rotation_enabled: true,
            security_refresh_token_reuse_interval: 10
          }')"
          if ! curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$ref/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body" > /dev/null; then
            echo "::warning::Token thiếu quyền ghi cấu hình Auth (hoặc API lỗi): anh Trường bật tay Auth Hook Customize Access Token và các mục Auth (docs/van-hanh/mo-schema-app-data-api.md). Bước kiểm cuối sẽ báo nếu vẫn thiếu."
            exit 0
          fi
          echo "Đã đồng bộ cài đặt Auth của hmt-staging (hook token, đăng ký, mật khẩu, hai bước)."

      # Bài kiểm chủ động: khoá của hmt-platform KHÔNG được chạm hmt-prod (chốt 10/10/2026).
      # Mỗi khoá thử hai chiều; logic và kiểm thử ở scripts/check-isolation.{sh,test.ts}.
      - name: Kiểm khoá của hmt-platform không chạm được hmt-prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_PROJECT_REF: ${{ vars.PROD_PROJECT_REF }}
          PROD_CLOUDFLARE_ACCOUNT_ID: ${{ vars.PROD_CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          STAGING_PROJECT_REF="$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')"
          export STAGING_PROJECT_REF
          bash scripts/check-isolation.sh

      # Bài kiểm trên thử nghiệm thật: gửi mã Turnstile giả qua Edge Function login thì phải bị chặn
      # ngay (HMT_CAPTCHA), không được tới bước kiểm mật khẩu. Dùng tên đăng nhập không có tài khoản.
      - name: Kiểm Edge Function login chặn mã chống máy giả
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Chưa triển khai Edge Function: bỏ qua bài kiểm."
            exit 0
          fi
          out="$(curl -s -X POST "$VITE_SUPABASE_URL/functions/v1/login" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
            -d '{"login":"kiem.captcha@thu.hoamatoan.invalid","password":"KhongPhaiMatKhau1","captchaToken":"ma-gia"}')"
          if ! printf '%s' "$out" | grep -q '"HMT_CAPTCHA"'; then
            # Không in nguyên nội dung trả về (log công khai): chỉ in mã lỗi nếu có.
            code="$(printf '%s' "$out" | jq -r '.code // .error // "không rõ"' 2>/dev/null | cut -c1-60 || true)"
            echo "::error::Edge Function login KHÔNG chặn mã chống máy giả (mã trả về: ${code:-không đọc được})."
            exit 1
          fi
          echo "Mã chống máy giả bị Edge Function login chặn: đúng."

      # Tài khoản giả mỗi vai trò (scripts/seed-users.ts tự chặn nếu không thấy dữ liệu giả).
      - name: Tạo tài khoản giả trên hmt-staging
        env:
          API_URL: ${{ vars.VITE_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
          SEED_ASSIGN_MANAGERS: '1'
          # Tài khoản tập cho đào tạo (ql, tvts, cskh, vh theo cơ sở; ketoan.tap, mkt.tap, bgd.tap). Chỉ thử nghiệm.
          SEED_PRACTICE: '1'
          # Mật khẩu RIÊNG của tài khoản tập (khác STAGING_SEED_PASSWORD của Tester). Thiếu secret thì không tạo tài khoản tập.
          SEED_PRACTICE_PASSWORD: ${{ secrets.STAGING_PRACTICE_PASSWORD }}
          # Đặt biến repo STAGING_PRACTICE_RESET = 1 cho MỘT lần chạy để đặt lại mật khẩu tài khoản tập đã có; xong thì xoá biến.
          SEED_PRACTICE_RESET: ${{ vars.STAGING_PRACTICE_RESET }}
        run: |
          if [ -z "$SECRET_KEY" ] || [ -z "$SEED_PASSWORD" ]; then
            echo "::warning::Chưa có STAGING_SUPABASE_SECRET_KEY hoặc STAGING_SEED_PASSWORD: chưa tạo tài khoản giả."
            exit 0
          fi
          npm run db:seed-users

      # Dữ liệu giả vừa phải CHỈ cho hmt-staging (D61b): Lead, Cơ hội, Báo giá, Đơn, Phiếu thu, Lớp, Học sinh, Ticket ở 5 cơ sở, để kiểm tìm kiếm, lọc, nhóm và đường đi trọn.
      # File do Code F viết (supabase/seed-staging.sql), phải chạy lại được, không nhân đôi, chỉ dữ liệu giả. Cùng STAGING_DB_URL như bước seed.sql; bản chạy thật
      # (hmt-deploy) không bao giờ chạy bước này. File chưa có thì bỏ qua kèm cảnh báo. Kiểm cuối: đếm số dòng vài bảng (không in dữ liệu).
      - name: Nạp dữ liệu giả vừa phải vào hmt-staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ ! -f supabase/seed-staging.sql ]; then
            echo "::warning::Chưa có supabase/seed-staging.sql: bỏ qua nạp dữ liệu giả vừa phải."
            exit 0
          fi
          psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -q -f supabase/seed-staging.sql
          counts="$(psql "$STAGING_DB_URL" -X -At -F ' ' -c "select 'lead', count(*) from app.lead union all select 'opportunity', count(*) from app.opportunity union all select 'quotation', count(*) from app.quotation union all select 'sales_order', count(*) from app.sales_order union all select 'receipt', count(*) from app.receipt union all select 'class', count(*) from app.class union all select 'enrollment', count(*) from app.enrollment union all select 'ticket', count(*) from app.ticket")"
          echo "$counts" | sed 's/^/Số dòng: /'
          # Bảng quan trọng rỗng thì lượt triển khai báo đỏ (dữ liệu giả không vào).
          if echo "$counts" | awk '$2 == 0 {bad = 1} END {exit bad ? 0 : 1}'; then
            echo "::error::Sau seed-staging.sql vẫn còn bảng rỗng (xem dòng «Số dòng» ở trên)."
            exit 1
          fi

      # Lớp, buổi, học sinh giả cho giáo viên tập gvtap1.cs5 (E-27-16): hôm qua đã Done, hôm nay chưa điểm danh, các ngày sau.
      # CHỈ hmt-staging (hmt-deploy không có bước này; file còn tự kiểm khoá môi trường STAGING). Chạy lại được: còn buổi sắp tới thì bỏ qua.
      # Lỗi ở đây không chặn lượt triển khai: chỉ cảnh báo.
      - name: Nạp dữ liệu giả cổng Giáo viên vào hmt-staging
        continue-on-error: true
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if ! psql "$STAGING_DB_URL" -X -v ON_ERROR_STOP=1 -q -f supabase/seed-staging-gv.sql; then
            echo "::warning::seed-staging-gv.sql lỗi: tài khoản gvtap1.cs5 có thể chưa có lớp, buổi."
            exit 1
          fi

      - name: Build bản thử nghiệm
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_ENV: staging
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Tạo project Pages hmt-staging nếu chưa có
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          if ! out="$(npx wrangler pages project create hmt-staging --production-branch=main 2>&1)"; then
            if printf '%s' "$out" | grep -qiE 'already exists|8000002'; then
              echo "Project hmt-staging đã có."
            else
              # Repo công khai: log ai cũng đọc. Chỉ in vài dòng đã lọc, không in nguyên đầu ra của wrangler.
              printf '%s\n' "$out" | tail -n 5 | cut -c1-200
              exit 1
            fi
          fi

      - name: Triển khai lên Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          npx wrangler pages deploy dist --project-name=hmt-staging --branch=main

      - name: Gắn tag staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="staging-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short=7 HEAD)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" -m "Bản đã lên thử nghiệm (hmt-staging) lúc $(date -u '+%Y-%m-%d %H:%M') UTC"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
              push origin "refs/tags/$tag"
          {
            echo "### Đã lên thử nghiệm"
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Địa chỉ: https://hmt-staging.pages.dev"
            echo "- Đưa lên chạy thật: repo \`hmt-deploy\` > Actions > Deploy production > nhập \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Kiểm cuối (sau khi bản đã lên và tag đã gắn): schema app phải mở qua Data API. Gọi bằng khoá publishable, không cần đăng nhập:
      # nếu schema chưa mở, PostgREST trả 406 (PGRST106); đã mở thì trả 200 hoặc 401/403 (RLS, quyền) nhưng không phải 406.
      - name: Kiểm schema app mở qua Data API (đăng nhập cần)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' "$VITE_SUPABASE_URL/rest/v1/catalog?select=code&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H 'Accept-Profile: app')"
          if [ "$code" = "406" ]; then
            echo "::error::Schema app CHƯA mở qua Data API của hmt-staging (PGRST106): đăng nhập sẽ báo «Hệ thống đang lỗi». Vào Supabase > Settings > API > Exposed schemas, thêm app."
            exit 1
          fi
          echo "Schema app mở qua Data API (mã $code): đúng."

      # Kiểm cuối: đăng nhập thật bằng tài khoản giả (mật khẩu seed), token phải có vai trò (Auth Hook bật). Không in mật khẩu, không in token.
      - name: Kiểm đăng nhập thật thấy claim vai trò (Auth Hook)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          SEED_PASSWORD: ${{ secrets.STAGING_SEED_PASSWORD }}
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo "::warning::Chưa có STAGING_SEED_PASSWORD: bỏ qua kiểm đăng nhập thật."
            exit 0
          fi
          echo "::add-mask::$SEED_PASSWORD"
          # A-23-16: gọi bằng khoá secret như Edge Function login (Supabase Auth bỏ qua captcha với khoá secret), nên bước này vẫn chạy khi captcha ở Auth được bật.
          # Không có khoá secret thì quay về khoá publishable (chỉ đúng khi captcha Auth chưa bật).
          SECRET_KEY="$(printf '%s' "$SECRET_KEY" | tr -d '[:space:]')"
          [ -z "$SECRET_KEY" ] || echo "::add-mask::$SECRET_KEY"
          api_key="${SECRET_KEY:-$VITE_SUPABASE_PUBLISHABLE_KEY}"
          payload="$(jq -nc --arg e 'quantri.cs5@thu.hoamatoan.invalid' --arg p "$SEED_PASSWORD" '{email: $e, password: $p}')"
          resp="$(curl -s -X POST "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $api_key" -H 'Content-Type: application/json' -d "$payload")"
          token="$(printf '%s' "$resp" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "::error::Không đăng nhập được bằng tài khoản giả (mã: $(printf '%s' "$resp" | jq -r '.error_code // .code // "không rõ"' | cut -c1-60)). Kiểm Auth Hook, schema app, mật khẩu seed."
            exit 1
          fi
          roles="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '.hmt_roles | length' 2>/dev/null || echo 0)"
          if [ "${roles:-0}" -lt 1 ]; then
            echo "::error::Token đăng nhập KHÔNG có claim vai trò (hmt_roles): Auth Hook «Customize Access Token» chưa bật trên hmt-staging."
            exit 1
          fi
          echo "Đăng nhập thật đạt: token có $roles vai trò."

      # A-23-16: lỗ hổng rà soát 23/11: gọi thẳng Supabase Auth bằng khoá publishable, KHÔNG mã captcha, không đi qua Edge Function login (bỏ qua đếm sai, khoá tạm).
      # Captcha (Attack Protection) bật thì lời gọi này phải bị từ chối với captcha_failed. Gửi tên đăng nhập không tồn tại và mật khẩu bịa: không đụng tài khoản thật.
      # Biến repo STAGING_CAPTCHA_ENFORCED=true (đặt sau khi anh bật captcha ở hmt-staging) thì lỗi là ĐỎ; chưa đặt thì chỉ cảnh báo để không chặn deploy.
      - name: Kiểm gọi thẳng Auth không captcha bị chặn (captcha_failed)
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          ENFORCED: ${{ vars.STAGING_CAPTCHA_ENFORCED }}
        run: |
          resp="$(curl -s -X POST "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"kiem.captcha@thu.hoamatoan.invalid","password":"KhongPhaiMatKhau1"}')"
          code="$(printf '%s' "$resp" | jq -r '.error_code // .code // "khong-co"' 2>/dev/null | cut -c1-60)"
          if [ "$code" = "captcha_failed" ]; then
            echo "Gọi thẳng Auth không captcha bị chặn (captcha_failed): đúng."
            exit 0
          fi
          if [ "$ENFORCED" = "true" ]; then
            echo "::error::Gọi thẳng /auth/v1/token KHÔNG captcha không bị chặn (mã: $code). Captcha ở Authentication > Attack Protection của hmt-staging đã bị tắt hoặc chưa bật."
            exit 1
          fi
          echo "::warning::Gọi thẳng /auth/v1/token không captcha KHÔNG bị chặn (mã: $code). Bật captcha ở hmt-staging rồi đặt biến STAGING_CAPTCHA_ENFORCED=true để bước này thành bắt buộc."
