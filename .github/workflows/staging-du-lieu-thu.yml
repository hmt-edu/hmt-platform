# Dựng dữ liệu GIẢ trên hmt-staging để anh Trường thử BH-07 (một lần, chạy tay). Chỉ dùng khoá thử nghiệm của hmt-platform; không có ở hmt-deploy
# (bản chạy thật không bao giờ chạy). Mật khẩu không đi qua đây: chỉ nhận mã băm bcrypt (không đảo ngược được); xoá workflow này sau khi dùng.
name: Dựng dữ liệu thử BH-07 trên staging
on:
  workflow_dispatch:
    inputs:
      hash_tcs:
        description: 'Mã băm bcrypt ($2a$…) mật khẩu tài khoản Trưởng cơ sở giả'
        required: true
      hash_sale:
        description: 'Mã băm bcrypt ($2a$…) mật khẩu tài khoản Sale giả'
        required: true
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dựng tài khoản và đơn thử
        env:
          STAGING_API_URL: https://ungbwuabgakuaxdneygo.supabase.co
          STAGING_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          HASH_TCS: ${{ inputs.hash_tcs }}
          HASH_SALE: ${{ inputs.hash_sale }}
        run: node scripts/seed-staging-bh07.ts
