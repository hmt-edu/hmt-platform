# Kiểm thử mỗi PR: kiểm tra nhanh, DB (pgTAP) và Playwright (hai job riêng; Playwright chỉ khi có migration, đụng tiền hoặc nhãn full-ci), bản xem trước trên Cloudflare Pages (chỉ khi có nhãn preview).
# Nhánh main KHÔNG chạy đủ mỗi lần gộp: main chạy đủ (kiểm nhanh, pgTAP, Playwright) khi chạy tay (workflow_dispatch) trước đợt cập nhật bản thật.
# Chạy tay không chạy bản xem trước. Đỏ thì mở issue để anh thấy; Code sửa trước mọi việc khác (Q-21, Q-37). Không có lịch tự chạy (TÀI KHOẢN CHỦ DỰ ÁN bị GitHub khoá 13/11/2026).
name: CI

on:
  pull_request:
    # `labeled`: thêm nhãn `full-ci` thì chạy lại, buộc chạy đủ cả Playwright (Đ285 b: giảm phút Actions).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '**/*.md'
  workflow_dispatch:

# Mỗi PR chỉ giữ lượt chạy mới nhất (tiết kiệm phút Actions).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Gắn nhãn khác `full-ci` (ví dụ `preview`) chỉ chạy lại phần cần thiết, không chạy lại cả CI (tiết kiệm phút Actions, Q-21).
  checks:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    permissions:
      contents: read
    uses: ./.github/workflows/_checks.yml
    with:
      format-check: true

  # Chọn phần CI cần chạy (Đ210 #3, Đ281, Q-C3). Kiểm nhanh (checks) luôn chạy. DB (pgTAP) + Playwright và bản xem trước chỉ bị BỎ khi mọi file
  # PR đổi nằm trong deploy/, docs/, design/ hoặc là *.md (danh sách được bỏ; file lạ, thư mục mới, .github/, scripts/ chạy đủ). Chạy tay hoặc
  # không lấy được danh sách file: chạy đủ. Logic ở scripts/ci-filter.ts (có bài kiểm Vitest).
  changes:
    name: Chọn phần CI cần chạy
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.filter.outputs.full }}
      ui: ${{ steps.filter.outputs.ui }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Mọi lỗi (không lấy được danh sách file, bộ lọc lỗi) thì in full=true, ui=true: chạy đủ. Có kiểm thử ở scripts/ci-changes.test.ts.
        run: bash scripts/ci-changes.sh

  # Tách job (D13, 18/11/2026): pgTAP chạy riêng để lỗi cài trình duyệt hoặc e2e không che kết quả DB; chạy lại riêng từng job.
  db:
    name: DB (pgTAP)
    # Chờ kiểm tra nhanh xanh rồi mới chạy; bỏ khi PR chỉ đổi deploy/, docs/, design/, *.md. Bộ lọc/job `changes` hỏng thì chạy đủ (mặc định an toàn).
    needs: [checks, changes]
    if: >-
      always() && needs.checks.result == 'success' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (needs.changes.result != 'success' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - name: Khởi động Supabase local (chỉ dịch vụ cần)
        # Bình thường khoảng 1,5 đến 2 phút. Thử lại có chờ tăng dần khi kho ảnh báo «Rate exceeded» (scripts/supabase-start-retry.sh, D28).
        timeout-minutes: 15
        run: bash scripts/supabase-start-retry.sh

      - name: Dựng lại DB từ migration + seed
        run: npx supabase db reset

      - name: Kiểm thử DB (pgTAP)
        run: npx supabase test db

  # Playwright riêng (D13). Cùng điều kiện với DB (pgTAP), thêm: chỉ khi PR có migration, đụng tiền hoặc lõi (bộ lọc e2e, scripts/ci-filter.ts), có nhãn `full-ci`
  # hoặc bộ lọc hỏng. Tự dựng Supabase local và DB riêng (không dùng chung DB với job pgTAP).
  e2e:
    name: Playwright (máy tính + iPhone)
    needs: [checks, changes]
    if: >-
      always() && needs.checks.result == 'success' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (needs.changes.result != 'success' || (needs.changes.outputs.full == 'true' && needs.changes.outputs.e2e == 'true'))
    runs-on: ubuntu-24.04
    # Phải lớn hơn thời gian tối đa của bước Playwright (35 phút) cộng cài đặt, dựng DB.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - name: Khởi động Supabase local (chỉ dịch vụ cần)
        # Bình thường khoảng 1,5 đến 2 phút. Thử lại có chờ tăng dần khi kho ảnh báo «Rate exceeded» (scripts/supabase-start-retry.sh, D28).
        timeout-minutes: 15
        run: bash scripts/supabase-start-retry.sh

      - name: Dựng lại DB từ migration + seed
        run: npx supabase db reset

      - name: Lấy địa chỉ, khoá công khai của Supabase local
        # Khoá local là giá trị mặc định công khai của Supabase CLI; vẫn che trong log.
        run: |
          status_env="$(npx supabase status -o env)"
          api_url="$(printf '%s\n' "$status_env" | sed -n 's/^API_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          key="$(printf '%s\n' "$status_env" | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$key" ]; then
            key="$(printf '%s\n' "$status_env" | sed -n 's/^ANON_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          fi
          if [ -z "$api_url" ] || [ -z "$key" ]; then
            echo "::error::Không đọc được API_URL hoặc khoá công khai từ supabase status."
            exit 1
          fi
          secret="$(printf '%s\n' "$status_env" | sed -n 's/^SECRET_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          db_url="$(printf '%s\n' "$status_env" | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          # Mật khẩu tài khoản giả: sinh ngẫu nhiên mỗi lượt CI, không nằm trong repo.
          seed_password="Ci$(openssl rand -hex 12)9"
          echo "::add-mask::$seed_password"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key"
            echo "VITE_APP_ENV=local"
            echo "API_URL=$api_url"
            echo "SECRET_KEY=$secret"
            echo "DB_URL=$db_url"
            echo "SEED_PASSWORD=$seed_password"
          } >> "$GITHUB_ENV"

      - name: Tạo tài khoản giả cho kiểm thử đăng nhập
        run: npm run db:seed-users

      - name: Phiên bản Playwright
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # D18: trình duyệt và thư viện hệ thống có sẵn trong ảnh chính thức của Playwright (cùng phiên bản với package-lock), nên bỏ hẳn các bước
      # cache trình duyệt, cấu hình apt và cài trình duyệt (từng hỏng lặp lại vì kho gói Ubuntu chậm). Supabase, bản dựng và máy chủ xem trước
      # chạy trên runner; container dùng mạng máy chủ (--network host) để gọi 127.0.0.1.
      - name: Dựng giao diện và chạy máy chủ xem trước
        run: |
          npm run build
          nohup npm run preview -- --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4173 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::Máy chủ xem trước không lên sau 60 giây."
          cat preview.log
          exit 1

      - name: Playwright (trong ảnh chính thức, PR chỉ chạy máy tính)
        # PR thường: chỉ dự án «may-tinh» (Chromium). Nhãn full-ci, chạy tay (main): thêm «dien-thoai» (iPhone, WebKit).
        timeout-minutes: 35
        env:
          PW_VERSION: ${{ steps.pw.outputs.version }}
          ONLY_DESKTOP: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          args=""
          if [ "$ONLY_DESKTOP" = "true" ]; then args="--project=may-tinh"; fi
          # Kéo ảnh có thử lại (kho có lúc giới hạn lượt kéo), rồi chạy.
          img="mcr.microsoft.com/playwright:v${PW_VERSION}-noble"
          for i in 1 2 3; do
            docker pull "$img" && break
            echo "::warning::Lần $i kéo ảnh Playwright hỏng, chờ $((i * 20)) giây."
            sleep $((i * 20))
          done
          docker run --rm --network host --ipc=host \
            -v "$PWD:/work" -w /work \
            -e CI=true -e E2E_REUSE_SERVER=1 -e DB_URL -e SEED_PASSWORD -e API_URL -e SECRET_KEY \
            "$img" \
            npx playwright test $args

      - name: Lưu báo cáo Playwright khi trượt
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # S5 (RS-23-12): tách dựng và triển khai. Job dựng chạy mã của PR (npm ci, build) nhưng KHÔNG có secret, KHÔNG có environment, chỉ quyền đọc;
  # job triển khai bên dưới mới có token Cloudflare và không chạy bất kỳ mã nào của PR (không checkout, không npm ci).
  preview-build:
    name: Dựng bản xem trước (không có khoá)
    needs: [checks, db, e2e, changes]
    # Chỉ khi PR gắn nhãn `preview` (Q-21, anh chốt 06/11), chỉ PR từ chính repo và chỉ khi PR đổi giao diện (điều kiện giống job triển khai).
    if: >-
      always() && contains(github.event.pull_request.labels.*.name, 'preview') &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (needs.db.result == 'success' || needs.db.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.changes.result != 'success' ||
      (needs.changes.outputs.full == 'true' && needs.changes.outputs.ui == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_ENV: preview
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    outputs:
      ready: ${{ steps.cfg.outputs.ready }}
    steps:
      - name: Kiểm tra biến công khai
        id: cfg
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Bỏ qua bản xem trước vì chưa cài VITE_SUPABASE_URL hoặc VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - if: steps.cfg.outputs.ready == 'true'
        run: npm run build

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  preview:
    name: Bản xem trước (Cloudflare Pages)
    needs: [preview-build]
    # Chỉ chạy khi job dựng thành công (cùng điều kiện nhãn/PR của job dựng).
    if: needs.preview-build.result == 'success' && needs.preview-build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Repo công khai (16/11/2026): secret Cloudflare phải nằm trong GitHub Environment `preview` có «Required reviewers» và chỉ nhánh được phép,
    # KHÔNG để ở secret chung của repo. Nhờ vậy PR sửa workflow hoặc gắn nhãn `preview` không tự đọc được token; người duyệt bấm Approve mới chạy.
    # (Cài đặt Environment làm trên web: Settings > Environments > preview; xem SECURITY.md.)
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    # Khoá Cloudflare chỉ đưa vào đúng bước cần. Job này không checkout, không chạy mã của PR.
    env:
      # Ghim phiên bản wrangler (S6, RS-23-12); giữ khớp với "wrangler" trong package.json.
      WRANGLER_VERSION: 4.161.0
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Kiểm tra cấu hình
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Bỏ qua bản xem trước vì chưa cài:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          path: dist

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Không checkout nên không đọc được .nvmrc; giữ khớp với .nvmrc (24).
          node-version: 24

      # Cài wrangler đúng phiên bản ghim vào thư mục tạm NGOÀI mã PR, tắt script cài đặt (S5, S6).
      - name: Cài wrangler bản ghim
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wr"
          npm install --prefix "$RUNNER_TEMP/wr" --no-save --ignore-scripts --no-audit --no-fund "wrangler@$WRANGLER_VERSION"
          echo "$RUNNER_TEMP/wr/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Tạo project Pages hmt-staging nếu chưa có
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          if ! out="$(wrangler pages project create hmt-staging --production-branch=main 2>&1)"; then
            if printf '%s' "$out" | grep -qiE 'already exists|8000002'; then
              echo "Project hmt-staging đã có."
            else
              # Repo công khai: log ai cũng đọc. Chỉ in vài dòng đã lọc, không in nguyên đầu ra của wrangler.
              printf '%s\n' "$out" | tail -n 5 | cut -c1-200
              exit 1
            fi
          fi

      - name: Triển khai bản xem trước
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          # Tên nhánh theo luật của Cloudflare: chữ thường, số, gạch ngang, tối đa 28 ký tự.
          branch="$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//' | cut -c1-28 | sed -E 's/-$//')"
          # Không bao giờ ghi đè nhánh production (main) của hmt-staging từ PR.
          if [ -z "$branch" ] || [ "$branch" = "main" ]; then
            branch="pr-$PR_NUMBER"
          fi
          out="$(wrangler pages deploy dist --project-name=hmt-staging --branch="$branch" 2>&1)" || {
            echo "::error::wrangler pages deploy lỗi. Vài dòng cuối đã lọc:"
            printf '%s\n' "$out" | tail -n 5 | cut -c1-200
            exit 1
          }
          alias_url="https://$branch.hmt-staging.pages.dev"
          deploy_url="$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | head -n 1)"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"

      - name: Ghi link xem trước vào PR
        if: steps.cfg.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- hmt-preview -->'
          body="$marker
          **Bản xem trước** (nối DB thử nghiệm \`hmt-staging\`)

          - Link theo nhánh: $ALIAS_URL
          - Link lần triển khai này: ${DEPLOY_URL:-chưa đọc được}
          - Commit: \`$SHA\`"
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
          echo "Bản xem trước: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"

  # Chạy tay trên main mà đỏ: mở issue để anh thấy ngay (Q-37). Code sửa trước mọi việc khác.
  bao-do:
    name: Báo main đỏ
    needs: [checks, db, e2e]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (needs.checks.result == 'failure' || needs.db.result == 'failure' || needs.e2e.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh issue create --repo "$REPO" --title "CI đêm trên main đỏ (commit ${SHA:0:7})" \
            --body "Lần chạy đủ trên main đỏ. Xem: ${RUN_URL}. Code sửa trước mọi việc khác (Q-21, Q-37)."
