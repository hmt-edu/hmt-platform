# Kiểm thử mỗi PR: kiểm tra nhanh, DB (pgTAP), Playwright (chỉ khi có migration, đụng tiền hoặc nhãn full-ci), bản xem trước trên Cloudflare Pages (chỉ khi có nhãn preview).
# Nhánh main KHÔNG chạy đủ mỗi lần gộp: main chạy đủ (kiểm nhanh, pgTAP, Playwright) theo lịch đêm khi có commit mới kể từ lần chạy đủ gần nhất, và chạy tay
# (workflow_dispatch) trước đợt cập nhật bản thật. Lịch đêm và chạy tay không chạy bản xem trước. Đỏ thì mở issue để anh thấy; Code sửa trước mọi việc khác (Q-21, Q-37).
name: CI

on:
  pull_request:
    # `labeled`: thêm nhãn `full-ci` thì chạy lại, buộc chạy đủ cả Playwright (Đ285 b: giảm phút Actions).
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '**/*.md'
  # Lịch đêm (Q-37, anh chốt 07/11): 00:30 giờ Việt Nam. Chạy đủ trên main chỉ khi main có commit mới kể từ lần chạy đủ gần nhất (job `gate`), không thì bỏ qua.
  # Q-38 (anh chốt 07/11): từ khi gộp đến hết 12/11 chạy MỖI đêm. SAU 12/11 PHẢI ĐỔI MỘT DÒNG dưới đây còn 3 đêm mỗi tuần (thứ Hai, Tư, Sáu theo giờ Việt Nam):
  #   cron: '30 17 * * 0,2,4'   (17:30 UTC Chủ nhật, Ba, Năm = 00:30 thứ Hai, Tư, Sáu). Vẫn chỉ chạy khi có commit mới. Đừng quên: tiết kiệm phút Actions gói Free.
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

# Mỗi PR chỉ giữ lượt chạy mới nhất (tiết kiệm phút Actions).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Chỉ cho lịch đêm: main có commit mới kể từ lần chạy đủ gần nhất (lịch đêm hoặc chạy tay đã xong) thì chạy, không thì bỏ qua (tốn khoảng 1 phút).
  gate:
    name: Main có commit mới từ lần chạy đủ gần nhất?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Lần chạy đủ gần nhất trên main (lịch đêm hoặc chạy tay) đã xong, thành công hoặc đỏ; so với commit hiện tại. Không lấy được thì chạy (an toàn).
          if last="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=30" \
              --jq '[.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and (.conclusion == "success" or .conclusion == "failure")) | .head_sha] | first // empty' 2>/dev/null)"; then
            if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
              echo "::notice::Main chưa có commit mới từ lần chạy đủ gần nhất ($last): bỏ qua."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  # Gắn nhãn khác `full-ci` (ví dụ `preview`) chỉ chạy lại phần cần thiết, không chạy lại cả CI (tiết kiệm phút Actions, Q-21).
  checks:
    needs: gate
    if: >-
      !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'schedule' || needs.gate.outputs.run == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/_checks.yml
    with:
      format-check: true

  # Chọn phần CI cần chạy (Đ210 #3, Đ281, Q-C3). Kiểm nhanh (checks) luôn chạy. DB (pgTAP) + Playwright và bản xem trước chỉ bị BỎ khi mọi file
  # PR đổi nằm trong deploy/, docs/, design/ hoặc là *.md (danh sách được bỏ; file lạ, thư mục mới, .github/, scripts/ chạy đủ). Chạy tay hoặc
  # không lấy được danh sách file: chạy đủ. Logic ở scripts/ci-filter.ts (có bài kiểm Vitest).
  changes:
    name: Chọn phần CI cần chạy
    needs: gate
    if: >-
      !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'schedule' || needs.gate.outputs.run == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.filter.outputs.full }}
      ui: ${{ steps.filter.outputs.ui }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Mọi lỗi (không lấy được danh sách file, bộ lọc lỗi) thì in full=true, ui=true: chạy đủ. Có kiểm thử ở scripts/ci-changes.test.ts.
        run: bash scripts/ci-changes.sh

  db-e2e:
    name: DB (pgTAP) + Playwright
    # Chờ kiểm tra nhanh xanh rồi mới chạy (đỡ tốn phút khi lint/test đã trượt); bỏ khi PR chỉ đổi deploy/, docs/, design/, *.md.
    needs: [gate, checks, changes]
    # Chạy khi bộ lọc báo cần chạy đủ HOẶC bộ lọc/job `changes` hỏng (mặc định an toàn: chạy đủ). always() để job `changes` hỏng không làm bỏ qua.
    # Gắn nhãn khác `full-ci` thì bỏ qua (đã chạy ở lần đẩy commit).
    if: >-
      always() && needs.checks.result == 'success' &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'schedule' || needs.gate.outputs.run == 'true') &&
      (needs.changes.result != 'success' || needs.changes.outputs.full == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    # Playwright trên PR (Q-21, anh chốt 06/11) chỉ chạy khi PR có migration hoặc đụng tiền (đơn hàng, phiếu thu, số dư; theo đường dẫn, xem
    # scripts/ci-filter.ts: isMoney, needsE2e). PR khác chạy pgTAP, bỏ Playwright (Code dán kết quả `npm run check:all` trên máy vào bình luận PR).
    # Nhãn `full-ci` hoặc bộ lọc hỏng: chạy đủ. Nhánh main KHÔNG chạy đủ mỗi lần gộp: main chạy đủ theo lịch đêm khi có commit mới (job `gate`) và chạy tay trước đợt cập nhật bản thật.
    env:
      RUN_E2E: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        timeout-minutes: 5

      - name: Khởi động Supabase local (chỉ dịch vụ cần)
        # Bình thường khoảng 1,5 đến 2 phút.
        timeout-minutes: 8
        run: >-
          npx supabase start
          -x studio,imgproxy,mailpit,logflare,vector,realtime,storage-api,supavisor,postgres-meta

      - name: Dựng lại DB từ migration + seed
        run: npx supabase db reset

      - name: Kiểm thử DB (pgTAP)
        run: npx supabase test db

      - name: Lấy địa chỉ, khoá công khai của Supabase local
        if: env.RUN_E2E == 'true'
        # Khoá local là giá trị mặc định công khai của Supabase CLI; vẫn che trong log.
        run: |
          status_env="$(npx supabase status -o env)"
          api_url="$(printf '%s\n' "$status_env" | sed -n 's/^API_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          key="$(printf '%s\n' "$status_env" | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$key" ]; then
            key="$(printf '%s\n' "$status_env" | sed -n 's/^ANON_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          fi
          if [ -z "$api_url" ] || [ -z "$key" ]; then
            echo "::error::Không đọc được API_URL hoặc khoá công khai từ supabase status."
            exit 1
          fi
          secret="$(printf '%s\n' "$status_env" | sed -n 's/^SECRET_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          db_url="$(printf '%s\n' "$status_env" | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          echo "::add-mask::$key"
          echo "::add-mask::$secret"
          # Mật khẩu tài khoản giả: sinh ngẫu nhiên mỗi lượt CI, không nằm trong repo.
          seed_password="Ci$(openssl rand -hex 12)9"
          echo "::add-mask::$seed_password"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$key"
            echo "VITE_APP_ENV=local"
            echo "API_URL=$api_url"
            echo "SECRET_KEY=$secret"
            echo "DB_URL=$db_url"
            echo "SEED_PASSWORD=$seed_password"
          } >> "$GITHUB_ENV"

      - name: Tạo tài khoản giả cho kiểm thử đăng nhập
        if: env.RUN_E2E == 'true'
        run: npm run db:seed-users

      - name: Phiên bản Playwright
        if: env.RUN_E2E == 'true'
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache trình duyệt Playwright
        if: env.RUN_E2E == 'true'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-webkit
          # Đổi phiên bản Playwright thì lấy bản cũ làm nền, chỉ tải phần thiếu.
          restore-keys: |
            playwright-${{ runner.os }}-

      # Kho gói Ubuntu của Azure có lúc chậm: một gói đứng 80 đến 130 giây, cài thư viện hệ thống (khoảng 119 MB, 181 gói) hết
      # 6 phút rồi bị cắt (log 23/10, 2 lần trên #77). Hai biện pháp (anh duyệt 24/10):
      #   1. apt chờ tối đa 20 giây mỗi kết nối và thử lại 3 lần: gói đứng thì tải lại ngay, không đợi hết giờ của cả bước.
      #   2. Gói đã tải được giữ trong thư mục cache `~/.apt-cache` (khoá theo phiên bản Playwright): lượt sau không tải lại từ kho chậm.
      - name: Cache gói apt của trình duyệt
        if: env.RUN_E2E == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.apt-cache
            !~/.apt-cache/archives/lock
            !~/.apt-cache/archives/partial
          key: apt-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            apt-playwright-${{ runner.os }}-

      - name: Cấu hình apt (chờ ngắn, thử lại, giữ gói đã tải)
        if: env.RUN_E2E == 'true'
        run: |
          mkdir -p "$HOME/.apt-cache/archives/partial"
          # apt chạy bằng quyền gốc và tải bằng người dùng _apt: thư mục phải ghi được để không tải "không cách ly".
          chmod -R a+rwX "$HOME/.apt-cache"
          {
            echo 'Acquire::http::Timeout "20";'
            echo 'Acquire::https::Timeout "20";'
            echo 'Acquire::Retries "3";'
            echo "Dir::Cache::archives \"$HOME/.apt-cache/archives\";"
            echo 'APT::Keep-Downloaded-Packages "true";'
          } | sudo tee /etc/apt/apt.conf.d/99ci-mang-cham > /dev/null

      # Hai bước cài dưới đây từng treo hơn 22 phút (apt hoặc tải trình duyệt, không ra dòng log nào) cho tới khi hết giờ của cả
      # job. Bình thường mất dưới 1 phút (lần đầu không có cache khoảng 5 phút). Mỗi lần thử bị cắt sau 6 phút; thử lại đúng một
      # lần và chỉ ở bước cài (không thử lại bộ kiểm thử, lỗi thật không bị che). Trước lần thử lại dọn tiến trình apt còn kẹt.
      - name: Cài trình duyệt Playwright
        if: env.RUN_E2E == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 14
        run: |
          for attempt in 1 2; do
            if timeout -k 15 360 npx playwright install --with-deps chromium webkit; then exit 0; fi
            echo "::warning::Lần $attempt cài trình duyệt hỏng hoặc quá 6 phút."
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
          done
          echo "::error::Cài trình duyệt Playwright hỏng sau 2 lần thử."
          exit 1

      - name: Cài thư viện hệ thống cho trình duyệt (khi dùng cache)
        if: env.RUN_E2E == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 14
        run: |
          for attempt in 1 2; do
            if timeout -k 15 360 npx playwright install-deps chromium webkit; then exit 0; fi
            echo "::warning::Lần $attempt cài thư viện hệ thống hỏng hoặc quá 6 phút."
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            sudo dpkg --configure -a || true
          done
          echo "::error::Cài thư viện hệ thống cho trình duyệt hỏng sau 2 lần thử."
          exit 1

      - name: Cho phép đọc gói apt đã tải (để lưu cache)
        if: always() && env.RUN_E2E == 'true'
        run: sudo chmod -R a+rX "$HOME/.apt-cache" || true

      - name: Playwright (máy tính + iPhone)
        if: env.RUN_E2E == 'true'
        # Bình thường 10 đến 12 phút.
        timeout-minutes: 20
        run: npm run e2e

      - name: Lưu báo cáo Playwright khi trượt
        if: failure() && env.RUN_E2E == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  preview:
    name: Bản xem trước (Cloudflare Pages)
    needs: [checks, db-e2e, changes]
    # Chỉ khi PR gắn nhãn `preview` (Q-21, anh chốt 06/11), chỉ PR từ chính repo (PR từ fork không có secrets) và chỉ khi PR đổi giao diện.
    # Gắn nhãn `preview` thì chỉ job này chạy (kiểm nhanh, DB, Playwright bị bỏ: kết quả skipped được chấp nhận); đẩy commit mới thì chờ kiểm nhanh
    # và DB xanh như trước. Bộ lọc/job `changes` hỏng hoặc bị bỏ thì vẫn chạy (an toàn); always() để không bị bỏ qua dây chuyền.
    if: >-
      always() && contains(github.event.pull_request.labels.*.name, 'preview') &&
      (needs.checks.result == 'success' || needs.checks.result == 'skipped') &&
      (needs.db-e2e.result == 'success' || needs.db-e2e.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.changes.result != 'success' ||
      (needs.changes.outputs.full == 'true' && needs.changes.outputs.ui == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # Khoá Cloudflare chỉ đưa vào đúng bước cần, không để npm ci thấy.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_APP_ENV: preview
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Kiểm tra cấu hình
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing VITE_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::notice::Bỏ qua bản xem trước vì chưa cài:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - if: steps.cfg.outputs.ready == 'true'
        run: npm run build

      - name: Tạo project Pages hmt-staging nếu chưa có
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          if ! out="$(npx wrangler pages project create hmt-staging --production-branch=main 2>&1)"; then
            if printf '%s' "$out" | grep -qiE 'already exists|8000002'; then
              echo "Project hmt-staging đã có."
            else
              printf '%s\n' "$out"
              exit 1
            fi
          fi

      - name: Triển khai bản xem trước
        id: deploy
        if: steps.cfg.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bỏ khoảng trắng, xuống dòng lỡ dán kèm; che giá trị đã làm sạch khỏi log; kiểm đúng dạng (không in giá trị).
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"; export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"; export CLOUDFLARE_ACCOUNT_ID
          [ -z "$CLOUDFLARE_API_TOKEN" ] || echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && ! printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE '^[A-Za-z0-9_-]{30,80}$'; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN sai dạng (chỉ được là chuỗi token, không kèm lệnh curl hay chữ khác). Dán lại đúng token."
            exit 1
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID sai dạng (phải là 32 ký tự 0-9, a-f)."
            exit 1
          fi
          # Tên nhánh theo luật của Cloudflare: chữ thường, số, gạch ngang, tối đa 28 ký tự.
          branch="$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-//; s/-$//' | cut -c1-28 | sed -E 's/-$//')"
          # Không bao giờ ghi đè nhánh production (main) của hmt-staging từ PR.
          if [ -z "$branch" ] || [ "$branch" = "main" ]; then
            branch="pr-$PR_NUMBER"
          fi
          out="$(npx wrangler pages deploy dist --project-name=hmt-staging --branch="$branch" 2>&1)" || {
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          alias_url="https://$branch.hmt-staging.pages.dev"
          deploy_url="$(printf '%s\n' "$out" | grep -oE 'https://[a-z0-9.-]+\.pages\.dev' | head -n 1)"
          echo "alias_url=$alias_url" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"

      - name: Ghi link xem trước vào PR
        if: steps.cfg.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- hmt-preview -->'
          body="$marker
          **Bản xem trước** (nối DB thử nghiệm \`hmt-staging\`)

          - Link theo nhánh: $ALIAS_URL
          - Link lần triển khai này: ${DEPLOY_URL:-chưa đọc được}
          - Commit: \`$SHA\`"
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
          echo "Bản xem trước: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"

  # Lịch đêm hoặc chạy tay trên main mà đỏ: mở issue để anh thấy ngay (Q-37). Code sửa trước mọi việc khác.
  bao-do:
    name: Báo main đỏ
    needs: [checks, db-e2e]
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.checks.result == 'failure' || needs.db-e2e.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh issue create --repo "$REPO" --title "CI đêm trên main đỏ (commit ${SHA:0:7})" \
            --body "Lần chạy đủ trên main đỏ. Xem: ${RUN_URL}. Code sửa trước mọi việc khác (Q-21, Q-37)."
